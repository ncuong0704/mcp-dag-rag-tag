services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      HF_EMBED_MODEL: sentence-transformers/all-MiniLM-L6-v2
      LOCAL_EMBED_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBED_PROVIDER: huggingface
      FAISS_INDEX_PATH: /data/faiss_index
      DOCUMENTS_PATH: /data/documents
      HF_HUB_DISABLE_XET: "1"
      N8N_URL: http://n8n:5678
    volumes:
      - ./data/documents:/data/documents:ro
      - faiss_index:/data/faiss_index
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - WEBHOOK_URL=http://${N8N_HOST}:${N8N_PORT}/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows:ro
      - ./data/schema_registry.json:/home/node/schema_registry.json:ro
    depends_on:
      - postgres
      - api

volumes:
  postgres_data:
  faiss_index:
  n8n_data:
  hf_cache:
